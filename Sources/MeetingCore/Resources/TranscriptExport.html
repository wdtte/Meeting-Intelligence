<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="meeting-intelligence-export-version" content="1">
<meta name="meeting-intelligence-locale" content="{{LOCALE}}">
<meta name="meeting-intelligence-complete" content="{{COMPLETE}}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src data:; img-src data:; script-src 'nonce-{{NONCE}}'; style-src 'nonce-{{NONCE}}'; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/png" href="{{APP_ICON}}">
<link rel="apple-touch-icon" href="{{APP_ICON}}">
<title>{{TITLE}} · 会议记录</title>
<style nonce="{{NONCE}}">
:root {
  color-scheme: light dark;
  --bg: #fff;
  --text: #202124;
  --muted: #606166;
  --line: #dcdce1;
  --fill: #f2f2f5;
  --active: #ededf1;
  --active-caption: #111;
  --wave: #989aa3;
  --glass: #f8f8f9ef;
  --focus: #005fc7;
  --error: #a32825;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --row-inset: 8px;
}
* { box-sizing: border-box; }
body {
  display: grid; grid-template-rows: minmax(0, 1fr) auto;
  height: 100vh; height: 100dvh; overflow: hidden;
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
}
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.page, .transcript { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.page { width: min(100%, 940px); margin-inline: auto; padding-block-start: max(16px, env(safe-area-inset-top)); }
.page, .player-dock {
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
}
.meeting-header { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.brand, .label { display: inline-flex; align-items: center; gap: 6px; }
.brand { gap: 7px; color: var(--muted); font-size: .75rem; font-weight: 600; }
.mark { display: block; width: 28px; height: 28px; object-fit: contain; }
.icon { width: 1em; height: 1em; flex: none; }
h1 { margin: 8px 0; font-size: 1.3125rem; line-height: 1.25; font-weight: 650; overflow-wrap: anywhere; }
@media screen {
  h1 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
}
.metadata { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.metadata, .notice, .hint, .count { color: var(--muted); font-size: .8125rem; }
.metadata { font-size: .75rem; }
.metadata span { min-width: 0; overflow-wrap: anywhere; }
.notice { margin: 8px 0 0; }
.notice:empty { display: none; }
.shortcuts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: var(--muted); font-size: .75rem; }
.shortcuts span { display: inline-flex; align-items: center; gap: 5px; }
kbd { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--fill); font: .75rem/1 var(--mono); }
.summary { margin-bottom: 20px; padding: 16px; background: var(--fill); border: 1px solid var(--line); border-radius: 10px; }
.summary-text { position: relative; white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0; }
.summary-text.is-revealing > .summary-content { opacity: 0; }
.summary-reveal { position: absolute; inset: 0; pointer-events: none; }
.summary-skip { min-height: 44px; padding: 0; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .75rem; text-decoration: underline; cursor: pointer; }
.summary-model { color: var(--muted); font-size: .75rem; margin: 0; }
.transcript-header {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, min(48%, 200px));
  align-items: center; gap: 10px; padding: 12px 0 8px;
}
.transcript-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
h2 { font-size: 1.0625rem; margin: 0; font-weight: 650; }
.hint { display: none; margin: 2px 0 0; }
.search-row { position: relative; min-width: 0; }
.search-row .icon {
  position: absolute; inset-block-start: 50%; inset-inline-start: 12px; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
input[type=search] {
  display: block; appearance: none; width: 100%; min-width: 0; min-height: 44px;
  margin: 0; padding: 0 12px 0 34px;
  border: 1px solid var(--line); border-radius: 8px; font: inherit; line-height: 1.25;
  color: var(--text); background: var(--fill);
}
input[type=search]::placeholder { color: var(--muted); }
.transcript-scroll {
  --scroll-gutter: calc(var(--row-inset) + 4px);
  --scroll-thumb: color-mix(in srgb, var(--muted) 45%, transparent);
  min-height: 0; overflow: auto; overscroll-behavior-y: contain; scroll-padding-block: 12px;
  margin-inline: calc(-1 * var(--scroll-gutter)); padding-inline: var(--scroll-gutter);
  padding-block: 2px max(12px, env(safe-area-inset-bottom));
}
@media (hover: hover) and (pointer: fine) and (forced-colors: none) {
  .transcript-scroll { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  @supports not (scrollbar-color: red transparent) {
    .transcript-scroll::-webkit-scrollbar { width: 8px; }
    .transcript-scroll::-webkit-scrollbar-thumb {
      border: 2px solid transparent; border-radius: 8px;
      background: var(--scroll-thumb) padding-box;
    }
  }
}
.transcript-scroll:focus-visible { outline-offset: -2px; }
.segment {
  position: relative; display: grid; gap: 0 16px; padding: 2px var(--row-inset) 9px;
  margin: 0 calc(-1 * var(--row-inset)) 4px; border-radius: 10px;
}
.segment-meta, .segment-labels { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; min-width: 0; }
.timestamp, .playback-time { font: .75rem/1.4 var(--mono); color: var(--muted); }
span.timestamp, button.timestamp { display: inline-flex; align-items: center; justify-self: start; }
button.timestamp {
  min-width: 44px; min-height: 44px; padding: 0;
  border: 0; border-radius: 6px; background: transparent; cursor: pointer;
}
.source { color: var(--muted); font-size: .75rem; font-weight: 550; }
.engine { max-width: 100%; padding: 1px 7px; border-radius: 12px; color: var(--muted); background: var(--fill); font-size: .6875rem; overflow-wrap: anywhere; }
.segment-text { margin: 0; font-size: .8125rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.has-player .segment-text { color: var(--muted); cursor: pointer; }
.has-player .is-active .segment-text { color: var(--active-caption); }
.empty, footer { color: var(--muted); text-align: center; }
.empty { margin: 0; padding: 28px 0; }
footer { margin-top: 24px; font-size: .75rem; }
.player-dock { padding-block: 6px max(10px, env(safe-area-inset-bottom)); }
.player {
  position: relative; max-width: 840px; margin: 0 auto; padding: 0 6px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--glass);
  box-shadow: 0 3px 14px #0001;
}
audio { display: block; width: 100%; }
.player-controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; height: 58px; }
.transport { display: flex; align-items: center; }
.timeline { min-width: 0; position: relative; }
.playback-time { position: absolute; inset-block-start: 0; inset-inline-end: 6px; white-space: nowrap; pointer-events: none; font-size: .6875rem; }
.seek-track { position: relative; height: 44px; }
.seek-track canvas {
  display: block; position: absolute; inset: 18px 6px auto; width: calc(100% - 12px); height: 16px;
  color: var(--text); pointer-events: none;
}
input[type=range] { display: block; width: 100%; height: 44px; margin: 0; accent-color: var(--text); cursor: pointer; }
.waveform-ready input[type=range] { position: relative; appearance: none; background: transparent; }
.waveform-ready input[type=range]::-webkit-slider-runnable-track { background: transparent; border: 0; }
.waveform-ready input[type=range]::-moz-range-track { background: transparent; border: 0; }
.waveform-ready input[type=range]::-webkit-slider-thumb { appearance: none; width: 12px; height: 16px; opacity: 0; }
.waveform-ready input[type=range]::-moz-range-thumb { width: 12px; height: 16px; opacity: 0; }
.transport button, #speed {
  min-width: 44px; min-height: 44px; padding: 0; border: 0; border-radius: 10px;
  background: transparent; color: var(--text); font: inherit; cursor: pointer;
}
.transport button { display: grid; place-items: center; }
.transport button .icon { width: 20px; height: 20px; }
#play .icon { width: 22px; height: 22px; }
#speed { width: 44px; appearance: none; text-align: center; font-size: .75rem; font-weight: 600; }
.player-error {
  position: absolute; inset: auto 0 calc(100% + 6px); margin: 0; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--error); font-size: .8125rem;
}
@media (hover: hover) {
  button.timestamp:hover, .transport button:hover, #speed:hover { background: var(--fill); }
}
@media (min-width: 40rem) {
  :root { --row-inset: 12px; }
  .page {
    padding-block-start: max(28px, env(safe-area-inset-top));
    padding-inline: max(32px, env(safe-area-inset-left)) max(32px, env(safe-area-inset-right));
  }
  .meeting-header { padding-bottom: 22px; }
  .brand { gap: 8px; font-size: .8125rem; }
  .mark { width: 28px; height: 28px; border-radius: 8px; }
  h1 { margin: 14px 0 10px; font-size: 1.625rem; }
  .metadata { gap: 4px 16px; font-size: .8125rem; }
  .transcript-header { grid-template-columns: minmax(0, 1fr) minmax(180px, 250px); align-items: center; padding: 16px 0 12px; }
  .hint { display: block; }
  input[type=search] { font-size: .875rem; min-height: 36px; }
  .segment { grid-template-columns: minmax(3.625rem, auto) minmax(0, 1fr); row-gap: 4px; padding-block: 12px; }
  .segment-meta { display: contents; }
  .segment-text { grid-column: 2; font-size: .84375rem; }
  .has-player .segment-text { color: var(--text); }
  .segment.is-active { background: var(--active); }
  .segment.is-active::before {
    content: ""; position: absolute; inset-block: 12px; inset-inline-start: 0;
    width: 2px; border-radius: 2px; background: var(--muted);
  }
  .timestamp { align-self: start; grid-column: 1; grid-row: 1 / span 2; }
  button.timestamp { min-height: 32px; margin-top: -7px; }
  .player-dock { padding-block: 6px 16px; }
  .player { padding-inline: 16px; }
  .player-controls { gap: 16px; }
}
@media (max-width: 20rem) {
  .player-dock { padding-inline: max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-right)); }
}
@media screen and (orientation: landscape) and (max-height: 24rem) {
  .page { padding-block-start: max(8px, env(safe-area-inset-top)); }
  .meeting-header {
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px;
    padding-bottom: 6px;
  }
  .meeting-header :is(.metadata, .notice) { grid-column: 1 / -1; }
  h1 { margin: 0; font-size: 1.125rem; }
  .transcript-header { padding-block: 4px; }
  .hint { display: none; }
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e1e; --text: #e9e9ed; --muted: #b1b1b8; --line: #3d3d42;
    --fill: #2b2b2f; --active: #343438; --active-caption: #fff;
    --wave: #72727c; --glass: #252528f5; --focus: #79b8ff; --error: #ff9a96;
  }
}
@media print {
  :root { --bg: #fff; --text: #000; --muted: #555; --line: #ddd; --fill: #fff; }
  body, .page, .transcript { display: block; height: auto; overflow: visible; }
  .page { width: auto; margin: 0; padding: 0; }
  .transcript-scroll { overflow: visible; margin: 0; padding: 0; }
  .player-dock, .search-row, #no-results, .shortcuts, .summary-skip, .summary-reveal { display: none; }
  .summary-text.is-revealing > .summary-content { opacity: 1; }
  .segment { break-inside: avoid; margin-inline: 0; }
  .segment[hidden] { display: grid !important; }
  .segment.is-active { background: none; }
  .segment.is-active::before { display: none; }
  .has-player .segment-text, .has-player .is-active .segment-text { color: var(--text); }
}
</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="wave" viewBox="0 0 20 20"><path d="M2 8v4m4-7v10m4-13v16m4-12v8m4-6v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="calendar" viewBox="0 0 20 20"><path d="M2.5 8h15M6 2v4m8-4v4M5 4h10a2.5 2.5 0 0 1 2.5 2.5v9A2.5 2.5 0 0 1 15 18H5a2.5 2.5 0 0 1-2.5-2.5v-9A2.5 2.5 0 0 1 5 4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 5.5V10l2.8 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="speaker" viewBox="0 0 20 20"><path d="M2 8h3l4-3v10l-4-3H2Zm10-1a4 4 0 0 1 0 6m2-8a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="mic" viewBox="0 0 20 20"><rect x="7" y="2" width="6" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 9v.5a5.5 5.5 0 0 0 11 0V9M10 15v3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="search-icon" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="play-icon" viewBox="0 0 20 20"><path d="M5 3.7a1 1 0 0 1 1.5-.86l10.1 6.3a1 1 0 0 1 0 1.72L6.5 17.16A1 1 0 0 1 5 16.3z" fill="currentColor"/></symbol>
  <symbol id="pause-icon" viewBox="0 0 20 20"><path d="M6 4v12m8-12v12" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></symbol>
  <symbol id="back" viewBox="0 0 20 20"><path d="M4 7a7.4 7.4 0 1 1-1 5M4 2.5V7h4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="10.5" y="13.7" text-anchor="middle" font-size="7" font-weight="650" fill="currentColor">15</text></symbol>
  <symbol id="forward" viewBox="0 0 20 20"><path d="M16 7a7.4 7.4 0 1 0 1 5m-1-9.5V7h-4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="9.5" y="13.7" text-anchor="middle" font-size="7" font-weight="650" fill="currentColor">15</text></symbol>
</svg>
<main class="page">
    <header class="meeting-header">
      <div class="brand"><img class="mark" src="{{APP_ICON}}" width="28" height="28" alt="">Meeting Intelligence</div>
      <h1 title="{{TITLE}}">{{TITLE}}</h1>
      <div class="metadata">
        <span class="label"><svg class="icon" aria-hidden="true"><use href="#calendar"/></svg>{{DATE}}</span>
        <span class="label"><svg class="icon" aria-hidden="true"><use href="#speaker"/></svg>{{APPLICATION}}</span>
        <span class="label"><svg class="icon" aria-hidden="true"><use href="#clock"/></svg>{{DURATION}}</span>
      </div>
      <p class="notice">{{NOTICE}}</p>
      <div id="shortcuts" class="shortcuts" aria-label="播放快捷键" hidden>
        <span><kbd aria-label="左方向键">←</kbd> 上一句</span>
        <span><kbd aria-label="右方向键">→</kbd> 下一句</span>
        <span><kbd aria-label="空格键">␣</kbd> 播放 / 暂停</span>
      </div>
    </header>
    <section class="transcript" aria-labelledby="transcript-title">
      <div class="transcript-header">
        <div>
          <div class="transcript-heading"><h2 id="transcript-title">转写记录</h2><span class="count" id="count" role="status">{{COUNT}} 段发言</span></div>
          <p class="hint">{{TRANSCRIPT_HINT}}</p>
        </div>
        <div class="search-row" id="search-row" hidden>
          <svg class="icon" aria-hidden="true"><use href="#search-icon"/></svg>
          <input type="search" id="search" aria-label="搜索转写" placeholder="搜索转写" autocomplete="off">
        </div>
      </div>
      <div class="transcript-scroll" id="transcript-scroll" role="region" aria-label="字幕列表" tabindex="0">
        {{SUMMARY}}
        <div id="segments">{{SEGMENTS}}</div>
        <p id="no-results" class="empty" hidden>没有找到匹配的内容，试试其它关键词。</p>
        <footer>Meeting Intelligence · 离线转写快照</footer>
      </div>
    </section>
</main>
{{PLAYER}}
<script nonce="{{NONCE}}">
(() => {
  'use strict';
  revealSummary();
  const audio = document.getElementById('audio');
  const search = document.getElementById('search');
  const rows = [...document.querySelectorAll('.segment')].map(element => ({
    element, start: Number(element.dataset.start), end: Number(element.dataset.end),
    text: element.textContent.toLocaleLowerCase()
  }));
  document.getElementById('search-row').hidden = rows.length === 0;
  search.addEventListener('input', () => {
    const query = search.value.trim().toLocaleLowerCase();
    let count = 0;
    for (const row of rows) {
      row.element.hidden = !row.text.includes(query);
      if (!row.element.hidden) count++;
    }
    document.getElementById('count').textContent = query ? `${count} / ${rows.length} 段发言` : `${rows.length} 段发言`;
    document.getElementById('no-results').hidden = count !== 0;
    if (audio && !audio.paused) updatePlayback();
  });
  let updatePlayback = () => {};
  if (!audio) return;
  document.getElementById('shortcuts').hidden = false;
  const play = document.getElementById('play');
  const slider = document.getElementById('position');
  const time = document.getElementById('playback-time');
  const transcriptScroll = document.getElementById('transcript-scroll');
  const error = document.getElementById('audio-error');
  const waveform = document.getElementById('waveform');
  const draw = buildWaveform(waveform, audio);
  let lastFollowed = null;
  let active = new Set();
  const clock = value => {
    const seconds = Math.floor(Number.isFinite(value) ? Math.max(0, value) : 0);
    const pad = n => String(n).padStart(2, '0');
    const hours = Math.floor(seconds / 3600);
    return (hours ? `${hours}:` : '') + `${pad(Math.floor(seconds / 60) % 60)}:${pad(seconds % 60)}`;
  };
  const setPlaying = () => {
    const label = audio.paused ? '播放录音' : '暂停录音';
    play.setAttribute('aria-label', label);
    play.title = label;
    play.querySelector('use').setAttribute('href', audio.paused ? '#play-icon' : '#pause-icon');
  };
  const update = () => {
    const position = audio.currentTime;
    slider.value = position;
    time.textContent = `${clock(position)} / ${clock(audio.duration)}`;
    slider.setAttribute('aria-valuetext', time.textContent);
    draw();
    const next = new Set();
    let first = null;
    for (const row of rows) {
      if (row.start > position) break;
      if (position >= row.end) continue;
      next.add(row.element);
      if (!active.has(row.element)) {
        row.element.classList.add('is-active');
        row.element.setAttribute('aria-current', 'true');
      }
      if (!first && !row.element.hidden) first = row.element;
    }
    for (const element of active) {
      if (next.has(element)) continue;
      element.classList.remove('is-active');
      element.removeAttribute('aria-current');
    }
    active = next;
    if (!audio.paused && first !== lastFollowed) {
      if (first) {
        const row = first.getBoundingClientRect();
        const center = row.top - transcriptScroll.getBoundingClientRect().top + row.height / 2;
        transcriptScroll.scrollTop += center - transcriptScroll.clientHeight / 2;
      }
      lastFollowed = first;
    }
  };
  updatePlayback = update;
  const durationChanged = () => {
    const duration = audio.duration;
    slider.disabled = !Number.isFinite(duration) || duration <= 0;
    slider.max = slider.disabled ? 0 : duration;
    update();
  };
  const seek = position => {
    if (!Number.isFinite(position)) return;
    audio.currentTime = Math.min(Math.max(0, position), Number.isFinite(audio.duration) ? audio.duration : Infinity);
    update();
  };
  const showError = message => {
    error.textContent = message;
    error.hidden = false;
  };
  const start = async position => {
    try {
      error.hidden = true;
      if (position !== undefined) seek(position);
      await audio.play();
    } catch (reason) {
      if (reason.name !== 'AbortError') showError('未能开始播放，请在浏览器中打开完整的 HTML 文件后重试。');
    }
  };
  play.addEventListener('click', () => { if (audio.paused) start(); else audio.pause(); });
  // Match the app: left skips the current sentence, including during playback.
  const sentenceStarts = [...new Set(rows.map(row => row.start).filter(value => Number.isFinite(value) && value >= 0))].sort((a, b) => a - b);
  document.addEventListener('keydown', event => {
    if (event.defaultPrevented || event.isComposing || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    if (event.target.closest('input, textarea, select, a, [contenteditable]:not([contenteditable="false"]), [role="textbox"]')) return;
    if (event.code === 'Space' || event.key === ' ') {
      const button = event.target.closest('button');
      if (button && !button.matches('#play, .timestamp')) return;
      event.preventDefault();
      if (!event.repeat) { if (audio.paused) start(); else audio.pause(); }
      return;
    }
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    const current = sentenceStarts.findLast(value => value <= audio.currentTime + 0.05);
    const destination = event.key === 'ArrowRight'
      ? sentenceStarts.find(value => value > audio.currentTime + 0.05)
      : sentenceStarts.findLast(value => value < current) ?? sentenceStarts[0];
    if (destination !== undefined) seek(destination);
  });
  document.getElementById('backward').addEventListener('click', () => seek(audio.currentTime - 15));
  document.getElementById('forward-button').addEventListener('click', () => seek(audio.currentTime + 15));
  slider.addEventListener('input', () => seek(Number(slider.value)));
  document.getElementById('segments').addEventListener('click', event => {
    if (!event.target.closest('button') && window.getSelection()?.toString()) return;
    const row = event.target.closest('.segment');
    if (row) start(Number(row.dataset.start));
  });
  const speed = document.getElementById('speed');
  audio.preservesPitch = true;
  speed.addEventListener('change', () => {
    const rate = Number(speed.value);
    if ([0.5, 0.75, 1, 1.5, 2, 3].includes(rate)) audio.playbackRate = rate;
  });
  audio.addEventListener('ratechange', () => { speed.value = String(audio.playbackRate); });
  audio.addEventListener('durationchange', durationChanged);
  audio.addEventListener('timeupdate', update);
  audio.addEventListener('seeked', update);
  audio.addEventListener('play', () => { lastFollowed = null; setPlaying(); update(); });
  audio.addEventListener('pause', setPlaying);
  audio.addEventListener('ended', setPlaying);
  const mediaError = () => showError('当前浏览器无法读取内嵌音频，请用 Safari、Chrome 或 Edge 打开完整的 HTML 文件。');
  audio.addEventListener('error', mediaError);
  if (audio.error) mediaError();
  durationChanged();
  audio.hidden = true;
  document.getElementById('player-controls').hidden = false;
  document.body.classList.add('has-player');
  draw();

  function revealSummary() {
    const paragraph = document.querySelector('.summary-text');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    if (!paragraph || reducedMotion.matches || document.hidden) return;
    const text = paragraph.textContent;
    if (!text) return;
    const characters = typeof Intl.Segmenter === 'function'
      ? [...new Intl.Segmenter('zh', { granularity: 'grapheme' }).segment(text)].map(item => item.segment)
      : Array.from(text);
    const original = document.createElement('span');
    original.className = 'summary-content';
    original.textContent = text;
    const preview = document.createElement('span');
    preview.className = 'summary-reveal';
    preview.setAttribute('aria-hidden', 'true');
    const skip = document.createElement('button');
    skip.type = 'button';
    skip.className = 'summary-skip';
    skip.textContent = '显示完整摘要';
    paragraph.replaceChildren(original, preview);
    paragraph.classList.add('is-revealing');
    paragraph.after(skip);
    let frame, started, shown = 0, finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      cancelAnimationFrame(frame);
      paragraph.textContent = text;
      paragraph.classList.remove('is-revealing');
      skip.remove();
      window.removeEventListener('beforeprint', finish);
      document.removeEventListener('visibilitychange', visibilityChanged);
      reducedMotion.removeEventListener('change', finish);
    };
    const visibilityChanged = () => { if (document.hidden) finish(); };
    const duration = Math.min(2800, Math.max(650, characters.length * 12));
    const tick = timestamp => {
      started ??= timestamp;
      const count = Math.min(characters.length, Math.max(1, Math.floor((timestamp - started) / duration * characters.length)));
      if (count !== shown) { preview.textContent = characters.slice(0, count).join(''); shown = count; }
      if (count >= characters.length) finish();
      else frame = requestAnimationFrame(tick);
    };
    skip.addEventListener('click', finish);
    window.addEventListener('beforeprint', finish);
    document.addEventListener('visibilitychange', visibilityChanged);
    reducedMotion.addEventListener('change', finish);
    frame = requestAnimationFrame(tick);
  }

  function buildWaveform(canvas, media) {
    if (!canvas.dataset.peaks || !window.ResizeObserver) return () => {};
    const context = canvas.getContext('2d');
    if (!context) return () => {};
    const peaks = canvas.dataset.peaks.split(',').map(Number);
    const highContrast = matchMedia('(forced-colors: active)');
    const colorScheme = matchMedia('(prefers-color-scheme: dark)');
    const draw = () => {
      if (canvas.hidden) return;
      const width = canvas.clientWidth, height = canvas.clientHeight;
      if (!width || !height) return;
      const pixelRatio = window.devicePixelRatio || 1;
      const w = Math.round(width * pixelRatio), h = Math.round(height * pixelRatio);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      context.clearRect(0, 0, width, height);
      const styles = getComputedStyle(canvas);
      const remaining = styles.getPropertyValue('--wave').trim();
      const played = styles.color;
      const progress = media.duration > 0 ? Math.min(1, media.currentTime / media.duration) : 0;
      const bars = Math.min(peaks.length, Math.max(1, Math.round(width / 4)));
      const step = width / bars;
      for (let index = 0; index < bars; index++) {
        let peak = 0;
        for (let i = Math.floor(index * peaks.length / bars); i < Math.floor((index + 1) * peaks.length / bars); i++) {
          peak = Math.max(peak, peaks[i]);
        }
        const bar = Math.max(1.5, Math.sqrt(peak / 255) * height);
        context.fillStyle = (index + 0.5) / bars <= progress ? played : remaining;
        context.fillRect(index * step, (height - bar) / 2, Math.max(1, step - 2), bar);
      }
      context.fillStyle = played;
      context.fillRect(Math.min(width - 1.5, progress * width), 0, 1.5, height);
    };
    const setAvailability = () => {
      canvas.hidden = highContrast.matches;
      canvas.parentElement.classList.toggle('waveform-ready', !canvas.hidden);
      draw();
    };
    new ResizeObserver(draw).observe(canvas);
    highContrast.addEventListener('change', setAvailability);
    colorScheme.addEventListener('change', draw);
    setAvailability();
    return draw;
  }
})();
</script>
</body>

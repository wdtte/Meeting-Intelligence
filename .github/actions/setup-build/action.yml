name: Set up build toolchain and cache
description: Select pinned Rust and restore architecture- and toolchain-specific caches.
inputs:
  edition:
    description: Isolate standard and compatibility compiler outputs.
    required: false
    default: standard
  cache-profile:
    description: Separate test-only caches from caches containing release build outputs.
    required: false
    default: test
runs:
  using: composite
  steps:
    - name: Select Rust and fingerprint toolchains
      id: toolchain
      shell: bash
      env:
        CACHE_PROFILE: ${{ inputs.cache-profile }}
        BUILD_EDITION: ${{ inputs.edition }}
      run: |
        case "$CACHE_PROFILE" in
          test|release) ;;
          *) echo 'cache-profile must be test or release' >&2; exit 2 ;;
        esac
        case "$BUILD_EDITION" in
          standard|compatibility) ;;
          *) echo 'edition must be standard or compatibility' >&2; exit 2 ;;
        esac
        if ! rustup run 1.99.1 rustc --version > /dev/null 2>&1; then
          rustup toolchain install 1.99.1 --profile minimal
        fi
        echo 'RUSTUP_TOOLCHAIN=1.99.1' >> "$GITHUB_ENV"
        {
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
          rustup run 1.99.1 rustc --version --verbose
        } > "$RUNNER_TEMP/meeting-toolchains.txt"
        cat "$RUNNER_TEMP/meeting-toolchains.txt"
        fingerprint=$(shasum -a 256 "$RUNNER_TEMP/meeting-toolchains.txt" | cut -d ' ' -f 1)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore Swift and Cargo caches
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .build
          Helpers/summary/target
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        # Cache entries are immutable. Test CI must not claim a Release cache key
        # before the optimized binaries have been built and saved.
        key: build-v3-${{ inputs.edition }}-${{ inputs.cache-profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Helpers/summary/Cargo.lock', 'Package.swift', '**/Package.resolved') }}-${{ github.sha }}
        restore-keys: |
          build-v3-${{ inputs.edition }}-${{ inputs.cache-profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Helpers/summary/Cargo.lock', 'Package.swift', '**/Package.resolved') }}-
          build-v3-${{ inputs.edition }}-${{ inputs.cache-profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-
          build-v2-${{ inputs.cache-profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Helpers/summary/Cargo.lock', 'Package.swift', '**/Package.resolved') }}-
          build-v2-${{ inputs.cache-profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-
          build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Helpers/summary/Cargo.lock', 'Package.swift', '**/Package.resolved') }}-
          build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-

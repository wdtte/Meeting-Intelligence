name: Release

on:
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS (${{ matrix.platform.arch }}, ${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, compatibility]
        platform:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      MEETING_BUILD_EDITION: ${{ matrix.edition }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare version and toolchains
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.platform.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version
          python3 - <<'PY'
          import os
          import plistlib
          import re
          with open('Resources/Info.plist', 'rb') as source:
              version = plistlib.load(source)['CFBundleShortVersionString']
          if os.environ['REF_TYPE'] == 'tag':
              match = re.fullmatch(r'v?(\d+\.\d+\.\d+)(?:[-+][0-9A-Za-z.-]+)?', os.environ['REF_NAME'])
              if match:
                  version = match[1]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MEETING_APP_VERSION={version}\n')
              output.write(f'MEETING_BUILD_NUMBER={os.environ["GITHUB_RUN_NUMBER"]}\n')
          PY

      - name: Set up toolchain and cache
        uses: ./.github/actions/setup-build
        with:
          cache-profile: release
          edition: ${{ matrix.edition }}

      - name: Cache pinned Whisper downloads
        if: matrix.edition == 'compatibility'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/whisper/downloads
            build/whisper/runtime/ggml-base-q5_1.bin
          key: whisper-downloads-${{ hashFiles('Helpers/whisper/manifest.json') }}

      - name: Check Whisper build dependency
        if: matrix.edition == 'compatibility'
        run: cmake --version

      - name: Test Swift
        run: ./scripts/test.sh

      - name: Test Rust
        run: cargo test --locked --manifest-path Helpers/summary/Cargo.toml

      - name: Build app
        env:
          MEETING_CODESIGN_IDENTITY: '-'
        run: ./scripts/build-app.sh release

      - name: Verify packaged upgrade from v0.2.6
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARCH: ${{ matrix.platform.arch }}
        run: |
          previous="$RUNNER_TEMP/meeting-previous"
          mkdir -p "$previous"
          suffix=""
          app='build/Meeting Intelligence.app'
          if [[ "$MEETING_BUILD_EDITION" == compatibility ]]; then
            suffix='-macos15-whisper'
            app='build/compatibility/Meeting Intelligence.app'
          fi
          gh release download v0.2.6 --repo wdtte/Meeting-Intelligence --pattern "Meeting-Intelligence-0.2.6-macos-$EXPECTED_ARCH$suffix.zip" --dir "$previous"
          ditto -x -k "$previous/Meeting-Intelligence-0.2.6-macos-$EXPECTED_ARCH$suffix.zip" "$previous/unpacked"
          python3 scripts/verify-upgrade.py "$previous/unpacked/Meeting Intelligence.app" "$app"

      - name: Set up Node for DMG packaging
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/dmg/package-lock.json

      - name: Install DMG packaging dependencies
        run: npm ci --prefix scripts/dmg --no-audit --no-fund

      - name: Package app
        run: |
          if [[ "$MEETING_BUILD_EDITION" == compatibility ]]; then
            ./scripts/package-release.sh dist 'build/compatibility/Meeting Intelligence.app'
          else
            ./scripts/package-release.sh
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.platform.arch }}-${{ matrix.edition }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Summarize phase timings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_JOB_NAME: Build macOS (${{ matrix.platform.arch }}, ${{ matrix.edition }})
        run: python3 scripts/ci-timing-summary.py

  compatibility-runtime:
    name: Verify macOS 15 (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download compatibility package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-${{ matrix.arch }}-compatibility
          path: dist
      - name: Verify on macOS 15
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          cd dist
          shasum -a 256 --check ./*.sha256
          ditto -x -k ./*-macos15-whisper.zip unpacked
          cd ..
          python3 scripts/verify-app.py 'dist/unpacked/Meeting Intelligence.app'
          ./scripts/verify-whisper-runtime.sh 'dist/unpacked/Meeting Intelligence.app'

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, compatibility-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" ./*.dmg ./*.zip ./*.sha256 --clobber
          args=(--draft=false)
          if [[ "$RELEASE_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
            notes="../docs/RELEASE-${BASH_REMATCH[1]}.md"
            if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); fi
          fi
          if [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            args+=(--prerelease)
          fi
          gh release edit "$RELEASE_TAG" "${args[@]}"

name: Build and release

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Prepare version and toolchains
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          python3 - <<'PY'
          import os
          import plistlib
          import re
          with open('Resources/Info.plist', 'rb') as source:
              version = plistlib.load(source)['CFBundleShortVersionString']
          if os.environ['REF_TYPE'] == 'tag':
              match = re.fullmatch(r'v?(\d+\.\d+\.\d+)(?:[-+][0-9A-Za-z.-]+)?', os.environ['REF_NAME'])
              if match:
                  version = match[1]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MEETING_APP_VERSION={version}\n')
              output.write(f'MEETING_BUILD_NUMBER={os.environ["GITHUB_RUN_NUMBER"]}\n')
          PY

      - name: Test Swift
        run: ./scripts/test.sh

      - name: Test Rust
        run: cargo test --locked --manifest-path Helpers/summary/Cargo.toml

      - name: Build app
        env:
          MEETING_CODESIGN_IDENTITY: '-'
        run: ./scripts/build-app.sh release

      - name: Package app
        run: ./scripts/package-release.sh

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.sha256 --clobber
          args=(--draft=false)
          if [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            args+=(--prerelease)
          fi
          gh release edit "$RELEASE_TAG" "${args[@]}"
